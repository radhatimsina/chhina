<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ECEAF3; --surface:#F8F7FC; --surface2:#EAE8F3; --ink:#1B1D3A; --muted:#565980;
  --line:#C9C7DA; --accent:#A5171F; --accent-ink:#FFF7F2; --gold:#8F6409; --focus:#2B4BD8;
  --font-body:'Hind','Noto Sans Devanagari',system-ui,sans-serif;
  --font-display:'Yatra One','Hind','Noto Serif Devanagari',Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12142A; --surface:#1B1E3B; --surface2:#242851; --ink:#EDE9DC; --muted:#A4A7C6;
    --line:#32376A; --accent:#F0665A; --accent-ink:#1A0B0C; --gold:#E3B341; --focus:#8EA2FF;
  }
}
:root[data-theme="dark"]{
  --bg:#12142A; --surface:#1B1E3B; --surface2:#242851; --ink:#EDE9DC; --muted:#A4A7C6;
  --line:#32376A; --accent:#F0665A; --accent-ink:#1A0B0C; --gold:#E3B341; --focus:#8EA2FF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;}
button,input,select,textarea{font:inherit;color:inherit;}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 64px;}
header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;padding:12px 0 22px;}
.brand h1{font-family:var(--font-display);font-weight:400;font-size:clamp(46px,9vw,84px);line-height:1;margin:0;letter-spacing:.01em;}
.brand h1 small{display:block;font-family:var(--font-body);font-size:clamp(15px,2.2vw,18px);color:var(--muted);letter-spacing:0;margin-top:10px;font-weight:400;max-width:34em;}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500;}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg);}
.tabs{display:flex;gap:8px;margin:6px 0 20px;flex-wrap:wrap;}
.tabs .seg{width:100%;max-width:520px;}
.tabs .seg button{flex:1;padding:10px 14px;}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;}
@media(min-width:960px){.grid{grid-template-columns:360px minmax(0,1fr);align-items:start;}.sticky{position:sticky;top:16px;}}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;}
.card h2{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0 0 12px;}
fieldset{border:0;padding:0;margin:0 0 18px;}
legend{font-weight:600;padding:0;margin-bottom:8px;color:var(--gold);}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px;}
input[type=text],input[type=number],input[type=date],input[type=time],select{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row3{display:grid;grid-template-columns:1.2fr 1.6fr 1fr;gap:10px;}
.check{display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--ink);font-size:15px;}
.check input{width:18px;height:18px;}
.btn{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:600;background:var(--accent);color:var(--accent-ink);}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
.btn[disabled]{opacity:.55;cursor:not-allowed;}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
.hint{font-size:13.5px;color:var(--muted);margin:6px 0 0;}
.err{color:var(--accent);font-weight:500;margin-top:10px;}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:36px 20px;text-align:center;color:var(--muted);}
.empty .om{font-family:var(--font-display);font-size:56px;color:var(--accent);line-height:1;}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--bg);}
.drop:hover,.drop.on{border-color:var(--accent);}
.drop img{max-width:100%;max-height:340px;border-radius:8px;display:block;margin:12px auto 0;}
.ai{margin-top:22px;}

.mini{width:100%;border-collapse:collapse;font-size:15px;}

.mini th{color:var(--muted);font-weight:500;}
.ok{color:#2E8B57;font-weight:600}.bad{color:var(--accent);font-weight:600}

.aihead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;}

.msg{padding:10px 14px;border-radius:14px;margin:10px 0;max-width:94%;line-height:1.7;}
.msg.u{background:var(--surface2);margin-left:auto;white-space:pre-wrap;}

<style id="scrollcss">
.scroll{--paper:#EBD9A6;--paper2:#E2CB92;--ink:#3A0C16;--verm:#A5171F;--gold:#8F6409;
  position:relative;max-width:860px;margin:30px auto;padding:44px 28px 40px;color:var(--ink);

  border-left:2px solid rgba(58,12,22,.28);border-right:2px solid rgba(58,12,22,.28);box-sizing:border-box;}

.scroll::before,.scroll::after{content:"";position:absolute;left:-14px;right:-14px;height:22px;border-radius:12px;
  background:linear-gradient(180deg,#7A1420,#4A0A14 55%,#2E060C);box-shadow:0 3px 8px rgba(0,0,0,.3);}
.scroll::before{top:-14px}.scroll::after{bottom:-14px}
.scroll h3{font-family:'Yatra One','Hind',serif;font-weight:400;color:var(--verm);font-size:20px;margin:26px 0 10px;border-bottom:1.5px solid rgba(143,100,9,.55);padding-bottom:4px;}

.scroll .kv span:last-child{font-weight:600;text-align:right}
.scroll .charts{display:flex;flex-wrap:wrap;gap:22px;justify-content:center}
.scroll .charts figure{margin:0;flex:1 1 300px;max-width:380px;text-align:center}
.scroll .charts figcaption{font-weight:600;margin-top:4px}
.scroll .charts svg{width:100%;height:auto;display:block}
.scroll table{width:100%;border-collapse:collapse;font-size:14.5px}
.scroll th,.scroll td{border-bottom:1px solid rgba(58,12,22,.3);padding:5px 6px;text-align:left;vertical-align:top}
.scroll th{color:var(--verm);font-weight:600}
.scroll tr.cur td{background:rgba(165,23,31,.12);font-weight:600}
.scroll .tw{overflow-x:auto}
.scroll ul{margin:6px 0 0;padding-left:20px}
.scroll .small{font-size:13px;color:#6B3A1A;margin-top:18px}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1><span data-i18n="appTitle">Chhina</span><small data-i18n="tagline"></small></h1>
    </div>
    <div class="seg" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">English</button>
      <button data-lang="ne" aria-pressed="false">नेपाली</button>
      <button data-lang="hi" aria-pressed="false">हिन्दी</button>
    </div>
  </header>

  <div class="tabs">
    <div class="seg" role="tablist">
      <button role="tab" id="tabC" aria-selected="true" data-tab="create" data-i18n="tabCreate"></button>
      <button role="tab" id="tabR" aria-selected="false" data-tab="read" data-i18n="tabRead"></button>
    </div>
  </div>

  <!-- CREATE -->
  <section id="paneCreate" class="grid">
    <form id="form" class="card sticky" autocomplete="off" onsubmit="return false">
      <fieldset>
        <legend data-i18n="secPerson"></legend>
        <label for="nm" data-i18n="name"></label>
        <input type="text" id="nm" maxlength="80">
        <label for="gender" data-i18n="gender"></label>
        <select id="gender"><option value="" data-i18n="noSay"></option><option value="m" data-i18n="male"></option><option value="f" data-i18n="female"></option><option value="o" data-i18n="other"></option></select>
      </fieldset>
      <fieldset>
        <legend data-i18n="secBirth"></legend>
        <label for="calMode" data-i18n="calendar"></label>
        <select id="calMode"><option value="AD" data-i18n="ad"></option><option value="BS" data-i18n="bs"></option></select>
        <div id="adBox">
          <label for="adDate" data-i18n="date"></label>
          <input type="date" id="adDate" value="1995-06-15">
        </div>
        <div id="bsBox" class="hidden">
          <label data-i18n="date"></label>
          <div class="row3">
            <input type="number" id="bsY" min="1900" max="2150" placeholder="2052" aria-label="Year">
            <select id="bsM" aria-label="Month"></select>
            <input type="number" id="bsD" min="1" max="32" placeholder="1" aria-label="Day">
          </div>
        </div>
        <label for="tm" data-i18n="time"></label>
        <input type="time" id="tm" value="06:30">
        <label class="check"><input type="checkbox" id="tmUnknown"><span data-i18n="timeUnknown"></span></label>
        <label for="place" data-i18n="place"></label>
        <select id="place"></select>
        <div class="row2">
          <div><label for="lat" data-i18n="lat"></label><input type="number" step="0.0001" id="lat"></div>
          <div><label for="lon" data-i18n="lon"></label><input type="number" step="0.0001" id="lon"></div>
        </div>
        <div class="row2">
          <div><label for="tzName" data-i18n="tzName"></label><input type="text" id="tzName"></div>
          <div><label for="offOv" data-i18n="offset"></label><input type="number" step="0.25" id="offOv" placeholder="5.75"></div>
        </div>
        <p class="hint" data-i18n="tzHint"></p>
      </fieldset>
      <fieldset>
        <legend data-i18n="secStyle"></legend>
        <select id="style"><option value="north" data-i18n="north"></option><option value="south" data-i18n="south"></option></select>
      </fieldset>
      <button class="btn" id="go" type="button" data-i18n="generate"></button>
      <div id="formErr" class="err" role="alert"></div>
    </form>

    <div id="createOut">
      <div class="empty"><div class="om">ॐ</div><p data-i18n="emptyCreate"></p></div>
    </div>
  </section>

  <!-- READ -->
  <section id="paneRead" class="hidden grid">
    <div class="card sticky">
      <h2 data-i18n="uploadTitle"></h2>
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a photo">
        <div data-i18n="uploadHint"></div>
        <img id="prev" alt="" class="hidden">
      </div>
      <input type="file" id="file" accept="image/*" class="hidden">
      <div class="btnrow">
        <button class="btn ghost" id="pick" type="button" data-i18n="choose"></button>
        <button class="btn" id="readBtn" type="button" disabled data-i18n="readBtn"></button>
        <button class="btn ghost hidden" id="stopRead" type="button" data-i18n="stop"></button>
      </div>
      <div id="readErr" class="err" role="alert"></div>
      <p class="hint" data-i18n="readNote"></p>
    </div>
    <div id="readOut">
      <div class="empty"><div class="om">ॐ</div><p data-i18n="emptyRead"></p></div>
    </div>
  </section>

  <p class="foot" data-i18n="foot"></p>
</div>

<script>
/*ENGINE_START*/
const D2R=Math.PI/180;
const norm=x=>((x%360)+360)%360;
const wrap180=x=>norm(x+180)-180;
const S=d=>Math.sin(d*D2R), C=d=>Math.cos(d*D2R);
function utcMs(y,m,d,h,mi){const t=new Date(0);t.setUTCFullYear(y,m-1,d);t.setUTCHours(h,mi,0,0);return t.getTime();}
const jdFromMs=ms=>ms/86400000+2440587.5;
const msFromJd=jd=>(jd-2440587.5)*86400000;
const tcent=jd=>(jd-2451545)/36525;

const fmtCache={};
function tzOffsetMin(tz,y,m,d,h,mi){
  let f=fmtCache[tz];
  if(!f){f=fmtCache[tz]=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'});}
  const target=utcMs(y,m,d,h,mi); let off=0;
  for(let i=0;i<3;i++){
    const t=target-off*60000; const p={};
    f.formatToParts(new Date(t)).forEach(x=>p[x.type]=x.value);
    off=(utcMs(+p.year,+p.month,+p.day,(+p.hour)%24,+p.minute)-t)/60000;
  }
  return off;
}

function ayanamsa(jd){const T=tcent(jd);return 23.85306+(5028.796195*T+1.1054348*T*T)/3600;}
function nutLon(jd){const T=tcent(jd);const om=125.04452-1934.136261*T;const L=280.4665+36000.7698*T;const Lm=218.3165+481267.8813*T;
  return (-17.20*S(om)-1.32*S(2*L)-0.23*S(2*Lm)+0.21*S(2*om))/3600;}

function sunTrop(jd){const T=tcent(jd);
  const L0=280.46646+36000.76983*T+0.0003032*T*T;
  const M=357.52911+35999.05029*T-0.0001537*T*T;
  const Cc=(1.914602-0.004817*T-0.000014*T*T)*S(M)+(0.019993-0.000101*T)*S(2*M)+0.000289*S(3*M);
  return norm(L0+Cc-0.00569-0.00478*S(125.04-1934.136*T));}

const MOON_TERMS=[[0,0,1,0,6288774],[2,0,-1,0,1274027],[2,0,0,0,658314],[0,0,2,0,213618],[0,1,0,0,-185116],[0,0,0,2,-114332],[2,0,-2,0,58793],[2,-1,-1,0,57066],[2,0,1,0,53322],[2,-1,0,0,45758],[0,1,-1,0,-40923],[1,0,0,0,-34720],[0,1,1,0,-30383],[2,0,0,-2,15327],[0,0,1,2,-12528],[0,0,1,-2,10980],[4,0,-1,0,10675],[0,0,3,0,10034],[4,0,-2,0,8548],[2,1,-1,0,-7888],[2,1,0,0,-6766],[1,0,-1,0,-5163],[1,1,0,0,4987],[2,-1,1,0,4036],[2,0,2,0,3994],[4,0,0,0,3861],[2,0,-3,0,3665],[0,1,-2,0,-2689],[2,0,-1,2,-2602],[2,-1,-2,0,2390],[1,0,1,0,-2348],[2,-2,0,0,2236],[0,1,2,0,-2120],[0,2,0,0,-2069],[2,-2,-1,0,2048]];
function moonTrop(jd){const T=tcent(jd);
  const Lp=218.3164477+481267.88123421*T-0.0015786*T*T;
  const D=297.8501921+445267.1114034*T-0.0018819*T*T;
  const M=357.5291092+35999.0502909*T-0.0001536*T*T;
  const Mp=134.9633964+477198.8675055*T+0.0087414*T*T;
  const F=93.2720950+483202.0175233*T-0.0036539*T*T;
  const E=1-0.002516*T-0.0000074*T*T;
  let sum=0;
  for(const t of MOON_TERMS){const am=Math.abs(t[1]);const e=am===1?E:am===2?E*E:1;
    sum+=t[4]*e*S(t[0]*D+t[1]*M+t[2]*Mp+t[3]*F);}
  sum+=3958*S(119.75+131.849*T)+1962*S(Lp-F)+318*S(53.09+479264.290*T);
  return norm(Lp+sum/1e6+nutLon(jd));}

// JPL approximate Keplerian elements (1800-2050), a,da,e,de,I,dI,L,dL,varpi,dvarpi,Omega,dOmega
const EL={
 Mercury:[0.38709927,0.00000037,0.20563593,0.00001906,7.00497902,-0.00594749,252.25032350,149472.67411175,77.45779628,0.16047689,48.33076593,-0.12534081],
 Venus:[0.72333566,0.00000390,0.00677672,-0.00004107,3.39467605,-0.00078890,181.97909950,58517.81538729,131.60246718,0.00268329,76.67984255,-0.27769418],
 Earth:[1.00000261,0.00000562,0.01671123,-0.00004392,-0.00001531,-0.01294668,100.46457166,35999.37244981,102.93768193,0.32327364,0,0],
 Mars:[1.52371034,0.00001847,0.09339410,0.00007882,1.84969142,-0.00813131,-4.55343205,19140.30268499,-23.94362959,0.44441088,49.55953891,-0.29257343],
 Jupiter:[5.20288700,-0.00011607,0.04838624,-0.00013253,1.30439695,-0.00183714,34.39644051,3034.74612775,14.72847983,0.21252668,100.47390909,0.20469106],
 Saturn:[9.53667594,-0.00125060,0.05386179,-0.00050991,2.48599187,0.00193609,49.95424423,1222.49362201,92.59887831,-0.41897216,113.66242448,-0.28867794]
};
function helio(name,T){
  const e=EL[name];
  const a=e[0]+e[1]*T,ec=e[2]+e[3]*T,I=e[4]+e[5]*T,L=e[6]+e[7]*T,w=e[8]+e[9]*T,Om=e[10]+e[11]*T;
  let M=wrap180(L-w); const Mr=M*D2R; let E=Mr+ec*Math.sin(Mr);
  for(let i=0;i<12;i++){E-=(E-ec*Math.sin(E)-Mr)/(1-ec*Math.cos(E));}
  const xp=a*(Math.cos(E)-ec), yp=a*Math.sqrt(1-ec*ec)*Math.sin(E);
  const om=w-Om;
  const co=C(om),so=S(om),cO=C(Om),sO=S(Om),cI=C(I),sI=S(I);
  return [(co*cO-so*sO*cI)*xp+(-so*cO-co*sO*cI)*yp,(co*sO+so*cO*cI)*xp+(-so*sO+co*cO*cI)*yp,(so*sI)*xp+(co*sI)*yp];
}
function planetLonJ2000(name,jd){const T=tcent(jd);const p=helio(name,T),e=helio('Earth',T);
  return norm(Math.atan2(p[1]-e[1],p[0]-e[0])/D2R);}
function planetTrop(name,jd){const T=tcent(jd);

function rahuTrop(jd){const T=tcent(jd);return norm(125.0445479-1934.1362891*T+0.0020754*T*T);}

function ascTrop(jd,lat,lon){

  const ramc=norm(th+lon);
  const eps=23.4392911-0.0130042*T;
  const y=C(ramc), x=-(S(ramc)*C(eps)+Math.tan(lat*D2R)*S(eps));
  return norm(Math.atan2(y,x)/D2R);

const GRAHA=['Sun','Moon','Mars','Mercury','Jupiter','Venus','Saturn','Rahu','Ketu'];
function allPositions(jd){
  const ay=ayanamsa(jd); const out={};
  out.Sun={lon:norm(sunTrop(jd)-ay),retro:false};
  out.Moon={lon:norm(moonTrop(jd)-ay),retro:false};
  for(const n of ['Mars','Mercury','Jupiter','Venus','Saturn']) out[n]={lon:norm(planetTrop(n,jd)-ay),retro:isRetro(n,jd)};
  const r=norm(rahuTrop(jd)-ay); out.Rahu={lon:r,retro:false}; out.Ketu={lon:norm(r+180),retro:false};

}

// ---- Vimshottari ----
const DSEQ=['Ketu','Venus','Sun','Moon','Mars','Rahu','Jupiter','Saturn','Mercury'];
const DYRS={Ketu:7,Venus:20,Sun:6,Moon:10,Mars:7,Rahu:18,Jupiter:16,Saturn:19,Mercury:17};
function vimshottari(moonLon,birthMs){
  const nl=360/27, ni=Math.floor(moonLon/nl), frac=(moonLon-ni*nl)/nl, st=ni%9, Y=365.25*86400000;
  let t=birthMs-frac*DYRS[DSEQ[st]]*Y; const list=[];
  for(let i=0;i<10;i++){const lord=DSEQ[(st+i)%9];const dur=DYRS[lord]*Y;const md={lord,start:t,end:t+dur,ad:[]};
    let tt=t;const li=DSEQ.indexOf(lord);
    for(let j=0;j<9;j++){const l2=DSEQ[(li+j)%9];const d2=dur*DYRS[l2]/120;md.ad.push({lord:l2,start:tt,end:tt+d2});tt+=d2;}

  const dayMs=utcMs(y,m,d,0,0);const jdN=jdFromMs(dayMs+(23*3600+59*60)*1000-NPT*3600000);

function bsToAD(by,bm,bd){
  const sy=bm>=9?by-56:by-57; const ay=by-57;
  const approx=jdFromMs(utcMs(ay,4,14,0,0))+bm*30.44;

}

// ---- Sunrise (for Hindu weekday) ----
function sunriseLocalHours(y,m,d,lat,lon,tzH,sunLonTrop){
  const N=Math.round((utcMs(y,m,d,0,0)-utcMs(y,1,1,0,0))/86400000)+1;
  const B=360/365*(N-81);const eot=9.87*S(2*B)-7.53*C(B)-1.5*S(B);
  const noon=12-lon/15+tzH-eot/60;
  const dec=Math.asin(S(23.4393)*S(sunLonTrop))/D2R;
  let cosH=(C(90.833)-S(lat)*S(dec))/(C(lat)*C(dec));cosH=Math.max(-1,Math.min(1,cosH));
  return noon-Math.acos(cosH)/D2R/15;
}

// ---- Master chart computation ----
function computeChart(inp){
  const {y,m,d,h,mi,lat,lon,tz,offOv,timeUnknown}=inp;
  let offMin; if(offOv!=null&&!isNaN(offOv)) offMin=offOv*60; else {try{offMin=tzOffsetMin(tz,y,m,d,h,mi);}catch(e){offMin=345;}}
  const tzH=offMin/60;
  const ms=utcMs(y,m,d,h,mi)-offMin*60000; const jd=jdFromMs(ms);
  const {pos,ay}=allPositions(jd);
  const ascS=norm(ascTrop(jd,lat,lon)-ay);
  const moonSign=Math.floor(pos.Moon.lon/30);
  const lagnaSign=timeUnknown?moonSign:Math.floor(ascS/30);
  const nl=360/27;
  const gr=GRAHA.map(k=>{const lon_=pos[k].lon;const sign=Math.floor(lon_/30);
    return {k,lon:lon_,sign,deg:lon_-sign*30,retro:pos[k].retro,nak:Math.floor(lon_/nl),pada:Math.floor((lon_%nl)/(nl/4))+1,
      house:((sign-lagnaSign+12)%12)+1,nav:Math.floor(lon_*9/30)%12};});
  const g=Object.fromEntries(gr.map(x=>[x.k,x]));
  const tithiN=Math.floor(norm(pos.Moon.lon-pos.Sun.lon)/12)+1;
  const yogaN=Math.floor(norm(pos.Sun.lon+pos.Moon.lon)/nl);
  const kIdx=Math.floor(norm(pos.Moon.lon-pos.Sun.lon)/6);
  const karana=kIdx===0?'K0':kIdx>=57?'K'+(kIdx-57+8):'K'+(((kIdx-1)%7)+1);
  const sunT=sunTrop(jd);
  const sr=sunriseLocalHours(y,m,d,lat,lon,tzH,sunT);
  let wd=new Date(utcMs(y,m,d,0,0)).getUTCDay();

  const asc={lon:ascS,sign:Math.floor(ascS/30),deg:ascS%30,nak:Math.floor(ascS/nl),pada:Math.floor((ascS%nl)/(nl/4))+1};
  return {inp,tzH,jd,ms,ay,pos,gr,g,asc,lagnaSign,timeUnknown:!!timeUnknown,
    panch:{tithiN,yogaN,karana,wd,nak:g.Moon.nak,pada:g.Moon.pada,sunrise:sr},
    dasha:vimshottari(pos.Moon.lon,ms),
    bs:adToBS(y,m,d)};
}

/* ===== Charts (SVG) ===== */
const NPOLY_C=[[200,100],[100,33],[33,100],[100,200],[33,300],[100,367],[200,300],[300,367],[367,300],[300,200],[367,100],[300,33]];
const NSIGN_P=[[200,178],[100,82],[82,100],[170,200],[82,300],[100,318],[200,222],[300,318],[318,300],[230,200],[318,100],[300,82]];
const NPER=[3,2,2,3,2,2,3,2,2,3,2,2];
function textBlock(items,cx,cy,per){
  const lines=[];for(let i=0;i<items.length;i+=per)lines.push(items.slice(i,i+per));
  const lh=18;let y=cy-(lines.length-1)*lh/2+5;
  return lines.map(l=>{const s=`<text x="${cx}" y="${y}" text-anchor="middle" font-size="15.5" font-weight="600" fill="#3A0C16">${l.map(it=>esc(it.a)+(it.r?'<tspan font-size="9" fill="#A5171F">R</tspan>':'')).join(' ')}</text>`;y+=lh;return s;}).join('');
}
const SVGHEAD=(title)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 412 412" role="img" aria-label="${esc(title)}" font-family="Hind,'Noto Sans Devanagari',sans-serif">`;
function svgNorth(housePl,signs,title,ascLabel){
  let s=SVGHEAD(title)+`<rect width="400" height="400" fill="#F1E3B6" stroke="#3A0C16" stroke-width="3"/>`+
   `<path d="M0 0L400 400M400 0L0 400M200 0L400 200L200 400L0 200Z" fill="none" stroke="#3A0C16" stroke-width="2"/>`;
  for(let h=0;h<12;h++){
    if(signs&&signs[h]!=null) s+=`<text x="${NSIGN_P[h][0]}" y="${NSIGN_P[h][1]+4}" text-anchor="middle" font-size="13" fill="#A5171F">${dn(signs[h]+1)}</text>`;
    if(housePl[h]&&housePl[h].length) s+=textBlock(housePl[h],NPOLY_C[h][0],NPOLY_C[h][1],NPER[h]);
  }
  if(ascLabel) s+=`<text x="200" y="38" text-anchor="middle" font-size="14" font-weight="600" fill="#A5171F">${esc(ascLabel)}</text>`;
  return s+'</svg>';
}
const SPOS={11:[0,0],0:[1,0],1:[2,0],2:[3,0],10:[0,1],3:[3,1],9:[0,2],4:[3,2],8:[0,3],7:[1,3],6:[2,3],5:[3,3]};
function svgSouth(signPl,lagnaSign,title,ascLabel){
  let s=SVGHEAD(title)+`<rect width="400" height="400" fill="#F1E3B6" stroke="#3A0C16" stroke-width="3"/>`;
  for(let i=1;i<4;i++){
    s+=`<path d="M${i*100} 0V${i===2?0:400}" stroke="#3A0C16" stroke-width="2"/>`;
  }
  // draw cell borders explicitly
  s=SVGHEAD(title)+`<rect width="400" height="400" fill="#F1E3B6" stroke="#3A0C16" stroke-width="3"/>`;
  for(const k in SPOS){const [c,r]=SPOS[k];s+=`<rect x="${c*100}" y="${r*100}" width="100" height="100" fill="none" stroke="#3A0C16" stroke-width="2"/>`;}
  for(const k in SPOS){const [c,r]=SPOS[k];const x=c*100,y=r*100;const sg=+k;
    s+=`<text x="${x+7}" y="${y+16}" font-size="12" fill="#A5171F">${dn(sg+1)}</text>`;
    if(sg===lagnaSign){s+=`<path d="M${x} ${y}L${x+26} ${y}L${x} ${y+26}Z" fill="#A5171F" opacity=".35"/>`;}
    const items=signPl[sg]||[];
    if(items.length) s+=textBlock(items,x+50,y+54,2);
  }
  if(ascLabel) s+=`<text x="200" y="190" text-anchor="middle" font-size="16" fill="#A5171F">${esc(ascLabel)}</text>`;
  return s+'</svg>';
}
function chartSvg(style,items,lagnaSign,title,ascLabel){ // items: [{sign,a,r}]
  if(style==='south'){const sp=Array.from({length:12},()=>[]);items.forEach(i=>sp[i.sign].push(i));return svgSouth(sp,lagnaSign,title,ascLabel);}
  const hp=Array.from({length:12},()=>[]);items.forEach(i=>hp[(i.sign-lagnaSign+12)%12].push(i));
  const signs=Array.from({length:12},(_,h)=>(lagnaSign+h)%12);
  return svgNorth(hp,signs,title,ascLabel);
}

/* ===== Chart-derived text ===== */
function dignityNote(g){
  const k=g.k;if(k==='Rahu'||k==='Ketu')return '';
  const n=[];if(EXALT[k]===g.sign)n.push(t('exalted'));if(DEBIL[k]===g.sign)n.push(t('debil'));if(OWN[k].includes(g.sign))n.push(t('own'));
  return n.join(', ');
}
function yogaList(ch){
  const out=[];const g=ch.g;const L=ch.lagnaSign;
  if(!ch.timeUnknown){
    if([1,2,4,7,8,12].includes(g.Mars.house)) out.push(t('manglik').replace('{h}',dn(g.Mars.house)));else out.push(t('notManglik'));
  }
  const dm=((g.Jupiter.sign-g.Moon.sign)+12)%12; if([0,3,6,9].includes(dm)) out.push(t('gajake'));
  if(g.Sun.sign===g.Mercury.sign) out.push(t('budhad'));
  if(!ch.timeUnknown){
    const pm={Mars:{en:'Ruchaka',dv:'रुचक'},Mercury:{en:'Bhadra',dv:'भद्र'},Jupiter:{en:'Hamsa',dv:'हंस'},Venus:{en:'Malavya',dv:'मालव्य'},Saturn:{en:'Shasha',dv:'शश'}};
    for(const k in pm){const gg=g[k];const kendra=[1,4,7,10].includes(gg.house);if(kendra&&(OWN[k].includes(gg.sign)||EXALT[k]===gg.sign))
      out.push(t('pm').replace('{p}',isDv()?pm[k].dv:pm[k].en).replace('{g}',gName(k)));}
  }
  const r=g.Rahu.lon;const inArc=(a,b,x)=>norm(x-a)<norm(b-a);
  const seven=['Sun','Moon','Mars','Mercury','Jupiter','Venus','Saturn'];
  if(seven.every(k=>inArc(r,r+180,g[k].lon))||seven.every(k=>inArc(r+180,r+360,g[k].lon))) out.push(t('kaalsarp'));
  return out.length?out:[t('noYoga')];
}
function currentDasha(ch){
  const now=Date.now();const md=ch.dasha.find(m=>now>=m.start&&now<m.end);
  return md?{md,ad:md.ad.find(a=>now>=a.start&&now<a.end)}:null;
}

function httpErr(status,body){
  const code=status===429?'rate_limited':status===503?'sampling_disabled':status===413?'image_rejected':(body&&body.code)||'upstream_error';
  return {code,message:(body&&body.error)||('HTTP '+status)};
}
async function apiStream(payload,{signal,onText}={}){
  let text='';
  let r;
  try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal});}
  catch(e){throw {code:e&&e.name==='AbortError'?'cancelled':'upstream_error',message:String(e)};}
  if(!r.ok){let j=null;try{j=await r.json();}catch(e){}throw httpErr(r.status,j);}
  const rd=r.body.getReader();const dec=new TextDecoder();
  try{
    for(;;){const {done,value}=await rd.read();if(done)break;
      text+=dec.decode(value,{stream:true});
      const i=text.indexOf('\u0000ERR:');
      if(i>=0){const code=text.slice(i+5).trim()||'upstream_error';text=text.slice(0,i);throw {code,message:'stream error',text:text||undefined};}
      if(onText)onText({text});}
  }catch(e){if(e&&e.code)throw e;throw {code:signal&&signal.aborted?'cancelled':'upstream_error',message:String(e),text:text||undefined};}
  if(!text.trim())throw {code:'empty_completion',message:'empty'};
  return {text};
}
function shrinkImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{const max=1800;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.86).split(',')[1]);};
    img.onerror=()=>{URL.revokeObjectURL(url);rej({code:'image_rejected',message:'decode'});};
    img.src=url;});
}
async function apiRead(file,signal){
  const image=await shrinkImage(file);
  let r;
  try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'read',image,mediaType:'image/jpeg'}),signal});}
  catch(e){throw {code:e&&e.name==='AbortError'?'cancelled':'upstream_error',message:String(e)};}
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok)throw httpErr(r.status,j);
  if(!j||!j.data)throw {code:'invalid_json',message:'no data'};
  return j.data;
}
function errCopy(e){
  switch(e&&e.code){
    case 'not_granted':case 'sampling_disabled':case 'not_declared':case 'capability_disabled':case 'capability_removed':return t('errGranted');
    case 'rate_limited':return t('errRate');
    case 'image_rejected':case 'images_unavailable':return t('errImage');
    case 'invalid_json':return t('errJson');
    case 'cancelled':return '';
    default:return t('errGeneric');}
}
function mdLite(s){
  const lines=esc(s).split(/\n+/);let html='';
  for(const ln of lines){
    const l=ln.trim();if(!l)continue;
    const m=l.match(/^#{1,4}\s*(.+)$/);
    const bold=x=>x.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    if(m)html+=`<h4>${bold(m[1])}</h4>`;
    else if(/^[-*•]\s+/.test(l))html+=`<p>• ${bold(l.replace(/^[-*•]\s+/,''))}</p>`;
    else html+=`<p>${bold(l)}</p>`;
  }return html;
}
function chartSummary(ch){
  const lines=[];
  lines.push(`Birth: ${ch.inp.y}-${pad(ch.inp.m)}-${pad(ch.inp.d)} ${ch.timeUnknown?'(time unknown)':pad(ch.inp.h)+':'+pad(ch.inp.mi)}, place ${ch.inp.placeName||''}`);
  lines.push(`Bikram Sambat (approx.): ${ch.bs.y} ${BSM_EN[ch.bs.m]} ${ch.bs.d}`);
  lines.push(`Lagna: ${ch.timeUnknown?'unknown (chart from Moon sign)':SIGN_EN[ch.asc.sign]+' '+ch.asc.deg.toFixed(1)+'°'}`);
  ch.gr.forEach(x=>lines.push(`${x.k}: ${SIGN_EN[x.sign]} ${x.deg.toFixed(1)}°, nakshatra ${NAK_EN[x.nak]} pada ${x.pada}, house ${ch.timeUnknown?'?':x.house}${x.retro&&x.k!=='Rahu'&&x.k!=='Ketu'?', retrograde':''}${dignityNote(x)?' ('+dignityNote(x).replace(/.*/,m=>m)+')':''}`));
  lines.push(`Tithi: ${ch.panch.tithiN<=15?'Shukla':'Krishna'} ${TITHI_EN[(ch.panch.tithiN-1)%15]}; Yoga: ${YOGA_EN[ch.panch.yogaN]}; Karana: ${KAR_EN[ch.panch.karana]}; Weekday: ${WD_EN[ch.panch.wd]}`);

  lines.push('Yogas noted: '+yogaList(ch).join(' | '));
  return lines.join('\n');
}

  }
  const kv=(a,v)=>`<tr><th>${esc(a)}</th><td>${v}</td></tr>`;
  const planetsRows=(ex.planets||[]).map(pl=>`<tr><td>${esc(gName(pl.name)||pl.name)}</td><td>${Number.isInteger(pl.sign)?esc(signShort(pl.sign-1)):'—'}</td><td>${Number.isInteger(pl.house)?dn(pl.house):'—'}</td><td>${esc(pl.degrees||'')}${pl.retrograde?' (R)':''}</td></tr>`).join('');
  out.innerHTML=`<div class="card"><h2>${esc(t('extracted'))}</h2>
    <div class="tw"><table class="mini"><tbody>
      ${kv(t('name'),nz(p.name))}${kv(t('gender'),nz(p.gender))}
      ${kv(t('adDate'),nz(b.ad_date))}${kv(t('bsDate'),nz(b.bs_date))}${kv(t('timeLbl'),nz(b.time_24h))}${kv(t('placeLbl'),nz(b.place))}
      ${kv(t('lagnaWritten'),Number.isInteger(ex.lagna_sign)?esc(signName(ex.lagna_sign-1)):nz(null))}
      ${kv(t('moonSign'),Number.isInteger(pc.moon_sign)?esc(signName(pc.moon_sign-1)):nz(null))}
      ${kv(t('tithi'),nz([pc.paksha,pc.tithi].filter(Boolean).join(' ')||null))}${kv(t('nakshatra'),nz(pc.nakshatra?(pc.nakshatra+(pc.pada?' · '+pc.pada:'')):null))}
      ${kv(t('yoga'),nz(pc.yoga))}${kv(t('karana'),nz(pc.karana))}${kv(t('vara'),nz(pc.weekday))}
    </tbody></table></div></div>
    ${chartHtml?`<div class="card" style="margin-top:18px"><h2>${esc(t('drawn'))}</h2><div class="scroll" style="margin:10px auto;max-width:420px;padding:20px;border:0;background:var(--paper)"><div class="charts"><figure style="max-width:380px">${chartHtml}</figure></div></div></div>`:''}
    <div class="card" style="margin-top:18px"><h2>${esc(t('planetsWritten'))}</h2><div class="tw"><table class="mini"><thead><tr><th>${esc(t('graha'))}</th><th>${esc(t('rashi'))}</th><th>${esc(t('bhava'))}</th><th>${esc(t('degree'))}</th></tr></thead><tbody>${planetsRows||`<tr><td colspan="4">${esc(t('unreadable'))}</td></tr>`}</tbody></table></div>
      ${ex.dasha&&(ex.dasha.balance_at_birth||ex.dasha.other)?`<p class="hint">${esc([ex.dasha.balance_at_birth,ex.dasha.other].filter(Boolean).join(' · '))}</p>`:''}
    </div>
    ${ex.notes?`<div class="card" style="margin-top:18px"><h2>${esc(t('notes'))}</h2><p style="white-space:pre-wrap;margin:0">${esc(ex.notes)}</p></div>`:''}
    <div class="btnrow">
      <button class="btn" id="rCmp" type="button">${esc(t('compare'))}</button>
      <button class="btn ghost" id="rUse" type="button">${esc(t('useCreate'))}</button>
    </div>
    <div id="cmpOut"></div>
    ${aiPanels('r')}`;
  document.getElementById('rCmp').onclick=()=>compareWithCalc(ex);
  document.getElementById('rUse').onclick=()=>useInCreate(ex);
  wireAI('r',()=>readSummary(ex),READ_EXTRA,'read');
}
function birthFromExtract(ex){
  const b=ex.birth||{};let y,m,d;
  if(b.ad_date&&/^\d{4}-\d{2}-\d{2}$/.test(b.ad_date)){[y,m,d]=b.ad_date.split('-').map(Number);}
  else if(b.bs_date&&/^\d{4}\/\d{1,2}\/\d{1,2}$/.test(b.bs_date)){const [by,bm,bd]=b.bs_date.split('/').map(Number);const a=bsToAD(by,bm-1,bd);y=a.y;m=a.m;d=a.d;}
  else return null;
  if(!b.time_24h||!/^\d{1,2}:\d{2}$/.test(b.time_24h))return null;
  const [h,mi]=b.time_24h.split(':').map(Number);
  if(typeof b.lat!=='number'||typeof b.lon!=='number')return null;
  let tz=b.tz_iana||'Asia/Kathmandu';try{new Intl.DateTimeFormat('en-US',{timeZone:tz});}catch(e){tz='Asia/Kathmandu';}
  return {y,m,d,h,mi,lat:b.lat,lon:b.lon,tz,offOv:null,timeUnknown:false,placeName:b.place||''};
}
function compareWithCalc(ex){
  const out=document.getElementById('cmpOut');const inp=birthFromExtract(ex);
  if(!inp){out.innerHTML=`<div class="card" style="margin-top:18px"><p class="hint">${esc(t('cmpNeed'))}</p></div>`;return;}
  const ch=computeChart(inp);
  const rows=[];
  const cmp=(label,w,c)=>{const ok=w!=null&&w===c;rows.push(`<tr><td>${esc(label)}</td><td>${w!=null?esc(signShort(w)):'—'}</td><td>${esc(signShort(c))}</td><td class="${ok?'ok':'bad'}">${w==null?'—':ok?'✓':'✗'}</td></tr>`);};
  cmp(t('lagna'),Number.isInteger(ex.lagna_sign)?ex.lagna_sign-1:null,ch.asc.sign);
  const {items}=extractedItems(ex);
  GRAHA.forEach(k=>{const w=items.find(i=>i.k===k);cmp(gName(k),w?w.sign:null,ch.g[k].sign);});
  out.innerHTML=`<div class="card" style="margin-top:18px"><h2>${esc(t('cmpTitle'))}</h2><div class="tw"><table class="mini"><thead><tr><th></th><th>${esc(t('written'))}</th><th>${esc(t('calc'))}</th><th>${esc(t('match'))}</th></tr></thead><tbody>${rows.join('')}</tbody></table></div><p class="hint">${esc(t('cmpNote'))}</p></div>`;
}
function useInCreate(ex){
  const b=ex.birth||{},p=ex.person||{};
  document.getElementById('nm').value=p.name||'';
  if(b.ad_date&&/^\d{4}-\d{2}-\d{2}$/.test(b.ad_date)){document.getElementById('calMode').value='AD';document.getElementById('adDate').value=b.ad_date;}
  else if(b.bs_date&&/^\d{4}\/\d{1,2}\/\d{1,2}$/.test(b.bs_date)){const [y,m,d]=b.bs_date.split('/').map(Number);document.getElementById('calMode').value='BS';document.getElementById('bsY').value=y;document.getElementById('bsM').value=m-1;document.getElementById('bsD').value=d;}
  syncCal();
  if(b.time_24h&&/^\d{1,2}:\d{2}$/.test(b.time_24h)){document.getElementById('tm').value=b.time_24h.split(':').map(x=>pad(+x)).join(':');document.getElementById('tmUnknown').checked=false;}
  if(typeof b.lat==='number'&&typeof b.lon==='number'){document.getElementById('place').value='custom';document.getElementById('lat').value=b.lat;document.getElementById('lon').value=b.lon;document.getElementById('tzName').value=b.tz_iana||'Asia/Kathmandu';}
  showTab('create');
}

/* ===== Wiring ===== */
function syncCal(){const m=document.getElementById('calMode').value;document.getElementById('adBox').classList.toggle('hidden',m!=='AD');document.getElementById('bsBox').classList.toggle('hidden',m!=='BS');}
function showTab(n){
  document.getElementById('paneCreate').classList.toggle('hidden',n!=='create');
  document.getElementById('paneRead').classList.toggle('hidden',n!=='read');
  document.getElementById('tabC').setAttribute('aria-selected',n==='create');
  document.getElementById('tabR').setAttribute('aria-selected',n==='read');
}
(function init(){
  const sel=document.getElementById('place');
  let html='';PLACES.forEach(([grp,list,tz])=>{html+=`<optgroup label="${esc(grp)}">`+list.map(p=>`<option value="${esc(p[0])}" data-lat="${p[1]}" data-lon="${p[2]}" data-tz="${p[3]||tz}">${esc(p[0])}</option>`).join('')+'</optgroup>';});
  html+=`<option value="custom">${esc(T.en.custom||'Other place (enter coordinates)')}</option>`;
  sel.innerHTML=html;
  T.en.custom='Other place (enter coordinates)';T.ne.custom='अन्य ठाउँ (अक्षांश/देशान्तर हाल्नुहोस्)';T.hi.custom='अन्य स्थान (निर्देशांक डालें)';
  function onPlace(){const o=sel.options[sel.selectedIndex];if(o.value==='custom')return;
    document.getElementById('lat').value=o.dataset.lat;document.getElementById('lon').value=o.dataset.lon;document.getElementById('tzName').value=o.dataset.tz;}
  sel.addEventListener('change',onPlace);
  sel.value='Kathmandu';onPlace();
  ['lat','lon','tzName'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{sel.value='custom';}));
  document.getElementById('calMode').addEventListener('change',syncCal);
  document.getElementById('tmUnknown').addEventListener('change',e=>{document.getElementById('tm').disabled=e.target.checked;});
  document.getElementById('go').addEventListener('click',generate);
  document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;applyLang();
    const c=document.querySelector('#place option[value="custom"]');if(c)c.textContent=t('custom');}));
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
  const file=document.getElementById('file'),drop=document.getElementById('drop');
  const pick=()=>file.click();
  drop.addEventListener('click',pick);drop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();}});
  document.getElementById('pick').addEventListener('click',pick);
  file.addEventListener('change',()=>setFile(file.files[0]));
  ['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('on');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('on');}));
  drop.addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files[0])setFile(e.dataTransfer.files[0]);});
  document.getElementById('readBtn').addEventListener('click',doRead);
  applyLang();
  const c=document.querySelector('#place option[value="custom"]');if(c)c.textContent=t('custom');
  initAI();
})();
</script>
