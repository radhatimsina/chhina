<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ECEAF3; --surface:#F8F7FC; --surface2:#EAE8F3; --ink:#1B1D3A; --muted:#565980;
  --line:#C9C7DA; --accent:#A5171F; --accent-ink:#FFF7F2; --gold:#8F6409; --focus:#2B4BD8;
  --font-body:'Hind','Noto Sans Devanagari',system-ui,sans-serif;
  --font-display:'Yatra One','Hind','Noto Serif Devanagari',Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12142A; --surface:#1B1E3B; --surface2:#242851; --ink:#EDE9DC; --muted:#A4A7C6;
    --line:#32376A; --accent:#F0665A; --accent-ink:#1A0B0C; --gold:#E3B341; --focus:#8EA2FF;
  }
}
:root[data-theme="dark"]{
  --bg:#12142A; --surface:#1B1E3B; --surface2:#242851; --ink:#EDE9DC; --muted:#A4A7C6;
  --line:#32376A; --accent:#F0665A; --accent-ink:#1A0B0C; --gold:#E3B341; --focus:#8EA2FF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;}
button,input,select,textarea{font:inherit;color:inherit;}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 64px;}
header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;padding:12px 0 22px;}
.brand h1{font-family:var(--font-display);font-weight:400;font-size:clamp(46px,9vw,84px);line-height:1;margin:0;letter-spacing:.01em;}
.brand h1 small{display:block;font-family:var(--font-body);font-size:clamp(15px,2.2vw,18px);color:var(--muted);letter-spacing:0;margin-top:10px;font-weight:400;max-width:34em;}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500;}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg);}
.tabs{display:flex;gap:8px;margin:6px 0 20px;flex-wrap:wrap;}
.tabs .seg{width:100%;max-width:520px;}
.tabs .seg button{flex:1;padding:10px 14px;}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;}
@media(min-width:960px){.grid{grid-template-columns:360px minmax(0,1fr);align-items:start;}.sticky{position:sticky;top:16px;}}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;}
.card h2{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0 0 12px;}
fieldset{border:0;padding:0;margin:0 0 18px;}
legend{font-weight:600;padding:0;margin-bottom:8px;color:var(--gold);}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px;}
input[type=text],input[type=number],input[type=date],input[type=time],select{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row3{display:grid;grid-template-columns:1.2fr 1.6fr 1fr;gap:10px;}
.check{display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--ink);font-size:15px;}
.check input{width:18px;height:18px;}
.btn{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:600;background:var(--accent);color:var(--accent-ink);}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
.btn[disabled]{opacity:.55;cursor:not-allowed;}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
.hint{font-size:13.5px;color:var(--muted);margin:6px 0 0;}
.err{color:var(--accent);font-weight:500;margin-top:10px;}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:36px 20px;text-align:center;color:var(--muted);}
.empty .om{font-family:var(--font-display);font-size:56px;color:var(--accent);line-height:1;}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--bg);}
.drop:hover,.drop.on{border-color:var(--accent);}
.drop img{max-width:100%;max-height:340px;border-radius:8px;display:block;margin:12px auto 0;}
.ai{margin-top:22px;}
.ai .out{white-space:normal;line-height:1.7;}
.ai .out h4{margin:16px 0 4px;font-family:var(--font-display);font-weight:400;font-size:18px;color:var(--gold);}
.ai .out p{margin:6px 0;}
.mini{width:100%;border-collapse:collapse;font-size:15px;}
.mini th,.mini td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top;}
.mini th{color:var(--muted);font-weight:500;}
.ok{color:#2E8B57;font-weight:600}.bad{color:var(--accent);font-weight:600}
.tw{overflow-x:auto;}
.aihead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;}

.inl{display:flex;gap:8px;align-items:center;margin:0;color:var(--muted);font-size:14px;}
.inl select{width:auto;padding:6px 10px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px;}

.chips button:hover{border-color:var(--accent);}
.chat{margin-top:10px;}
.msg{padding:10px 14px;border-radius:14px;margin:10px 0;max-width:94%;line-height:1.7;}
.msg.u{background:var(--surface2);margin-left:auto;white-space:pre-wrap;}
.msg.a{border:1.5px solid var(--line);background:var(--bg);}
.msg.a h4{margin:12px 0 4px;font-family:var(--font-display);font-weight:400;font-size:17px;color:var(--gold);}
.msg.a p{margin:5px 0;}
.askrow{display:flex;gap:8px;align-items:flex-end;margin-top:12px;flex-wrap:wrap;}
.askrow textarea{flex:1 1 240px;min-height:52px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);resize:vertical;}
details.pc{border:1.5px solid var(--line);border-radius:12px;margin:10px 0;background:var(--bg);}
details.pc summary{cursor:pointer;padding:11px 14px;list-style:revert;line-height:1.5;}
details.pc .why{display:block;font-size:13.5px;color:var(--muted);margin-top:2px;}
details.pc .pcb{padding:0 14px 12px;}
.gl{margin:6px 0;padding-left:20px;line-height:1.7;}
.gl li{margin:3px 0;}
.gk{color:var(--muted);font-size:14px;}
.mantra{font-weight:600;color:var(--gold);}
.pgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 10px;}
.pgrid label{margin:8px 0 3px;}
.pgrid select{padding:7px 8px;}
.foot{margin-top:34px;color:var(--muted);font-size:13.5px;max-width:70ch;}
.hidden{display:none !important;}
@media (prefers-reduced-motion:no-preference){.scrollwrap{animation:unroll .6s ease-out;}@keyframes unroll{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}}

/* One-page Letter sheet used to make the PDF */
.sheet{position:fixed;left:-20000px;top:0;width:816px;height:1056px;background:#fff;padding:30px;overflow:hidden;}
.sheet .fit{width:756px;transform-origin:top left;}

<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1><span data-i18n="appTitle">Chhina</span><small data-i18n="tagline"></small></h1>
    </div>
    <div class="seg" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">English</button>
      <button data-lang="ne" aria-pressed="false">नेपाली</button>
      <button data-lang="hi" aria-pressed="false">हिन्दी</button>
    </div>
  </header>

  <div class="tabs">
    <div class="seg" role="tablist">
      <button role="tab" id="tabC" aria-selected="true" data-tab="create" data-i18n="tabCreate"></button>
      <button role="tab" id="tabR" aria-selected="false" data-tab="read" data-i18n="tabRead"></button>
    </div>
  </div>

  <!-- CREATE -->
  <section id="paneCreate" class="grid">
    <form id="form" class="card sticky" autocomplete="off" onsubmit="return false">
      <fieldset>
        <legend data-i18n="secPerson"></legend>
        <label for="nm" data-i18n="name"></label>
        <input type="text" id="nm" maxlength="80">
        <div class="row2">
          <div><label for="fName" data-i18n="fatherName"></label><input type="text" id="fName" maxlength="80"></div>
          <div><label for="mName2" data-i18n="motherName"></label><input type="text" id="mName2" maxlength="80"></div>
        </div>
        <label for="gotra" data-i18n="gotra"></label>
        <input type="text" id="gotra" maxlength="40">
        <label for="gender" data-i18n="gender"></label>
        <select id="gender"><option value="" data-i18n="noSay"></option><option value="m" data-i18n="male"></option><option value="f" data-i18n="female"></option><option value="o" data-i18n="other"></option></select>
      </fieldset>
      <fieldset>
        <legend data-i18n="secBirth"></legend>
        <label for="calMode" data-i18n="calendar"></label>
        <select id="calMode"><option value="AD" data-i18n="ad"></option><option value="BS" data-i18n="bs"></option></select>
        <div id="adBox">
          <label for="adDate" data-i18n="date"></label>
          <input type="date" id="adDate" value="1995-06-15">
        </div>
        <div id="bsBox" class="hidden">
          <label data-i18n="date"></label>
          <div class="row3">
            <input type="number" id="bsY" min="1900" max="2150" placeholder="2052" aria-label="Year">
            <select id="bsM" aria-label="Month"></select>
            <input type="number" id="bsD" min="1" max="32" placeholder="1" aria-label="Day">
          </div>
        </div>
        <label for="tm" data-i18n="time"></label>
        <input type="time" id="tm" value="06:30">
        <label class="check"><input type="checkbox" id="tmUnknown"><span data-i18n="timeUnknown"></span></label>
        <label for="place" data-i18n="place"></label>
        <select id="place"></select>
        <div class="row2">
          <div><label for="lat" data-i18n="lat"></label><input type="number" step="0.0001" id="lat"></div>
          <div><label for="lon" data-i18n="lon"></label><input type="number" step="0.0001" id="lon"></div>
        </div>
        <div class="row2">
          <div><label for="tzName" data-i18n="tzName"></label><input type="text" id="tzName"></div>
          <div><label for="offOv" data-i18n="offset"></label><input type="number" step="0.25" id="offOv" placeholder="5.75"></div>
        </div>
        <p class="hint" data-i18n="tzHint"></p>
      </fieldset>
      <fieldset>
        <legend data-i18n="secStyle"></legend>
        <select id="style"><option value="north" data-i18n="north"></option><option value="south" data-i18n="south"></option></select>
      </fieldset>
      <button class="btn" id="go" type="button" data-i18n="generate"></button>
      <div id="formErr" class="err" role="alert"></div>
    </form>

    <div id="createOut">
      <div class="empty"><div class="om">ॐ</div><p data-i18n="emptyCreate"></p></div>
    </div>
  </section>

  <!-- READ -->
  <section id="paneRead" class="hidden grid">
    <div class="card sticky">
      <h2 data-i18n="mTitle"></h2>
      <p class="hint" data-i18n="mHint"></p>
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a photo" style="margin-top:12px">
        <div data-i18n="uploadHint"></div>
        <img id="prev" alt="" class="hidden">
      </div>
      <input type="file" id="file" accept="image/*" class="hidden">
      <label for="mName" data-i18n="name"></label>
      <input type="text" id="mName" maxlength="80">
      <label for="mLagna" data-i18n="mLagna"></label>
      <select id="mLagna"></select>
      <label data-i18n="mPlanets"></label>
      <div class="pgrid" id="mPlanets"></div>
      <div class="row2">
        <div><label for="mNak" data-i18n="mNak"></label><select id="mNak"></select></div>

      <label for="mDasha" data-i18n="mDasha"></label>

    <div id="readOut">
      <div class="empty"><div class="om">ॐ</div><p data-i18n="emptyRead"></p></div>
    </div>
  </section>

  <p class="foot" data-i18n="foot"></p>
</div>

<script>
/*ENGINE_START*/
const D2R=Math.PI/180;
const norm=x=>((x%360)+360)%360;
const wrap180=x=>norm(x+180)-180;
const S=d=>Math.sin(d*D2R), C=d=>Math.cos(d*D2R);
function utcMs(y,m,d,h,mi){const t=new Date(0);t.setUTCFullYear(y,m-1,d);t.setUTCHours(h,mi,0,0);return t.getTime();}
const jdFromMs=ms=>ms/86400000+2440587.5;
const msFromJd=jd=>(jd-2440587.5)*86400000;
const tcent=jd=>(jd-2451545)/36525;

const fmtCache={};
function tzOffsetMin(tz,y,m,d,h,mi){
  let f=fmtCache[tz];
  if(!f){f=fmtCache[tz]=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'});}
  const target=utcMs(y,m,d,h,mi); let off=0;
  for(let i=0;i<3;i++){
    const t=target-off*60000; const p={};
    f.formatToParts(new Date(t)).forEach(x=>p[x.type]=x.value);
    off=(utcMs(+p.year,+p.month,+p.day,(+p.hour)%24,+p.minute)-t)/60000;
  }
  return off;
}

function ayanamsa(jd){const T=tcent(jd);return 23.85306+(5028.796195*T+1.1054348*T*T)/3600;}
function nutLon(jd){const T=tcent(jd);const om=125.04452-1934.136261*T;const L=280.4665+36000.7698*T;const Lm=218.3165+481267.8813*T;
  return (-17.20*S(om)-1.32*S(2*L)-0.23*S(2*Lm)+0.21*S(2*om))/3600;}

function sunTrop(jd){const T=tcent(jd);
  const L0=280.46646+36000.76983*T+0.0003032*T*T;
  const M=357.52911+35999.05029*T-0.0001537*T*T;
  const Cc=(1.914602-0.004817*T-0.000014*T*T)*S(M)+(0.019993-0.000101*T)*S(2*M)+0.000289*S(3*M);
  return norm(L0+Cc-0.00569-0.00478*S(125.04-1934.136*T));}

const NPOLY_C=[[200,100],[100,33],[33,100],[100,200],[33,300],[100,367],[200,300],[300,367],[367,300],[300,200],[367,100],[300,33]];
const NSIGN_P=[[200,178],[100,82],[82,100],[170,200],[82,300],[100,318],[200,222],[300,318],[318,300],[230,200],[318,100],[300,82]];
const NPER=[3,2,2,3,2,2,3,2,2,3,2,2];
function textBlock(items,cx,cy,per){
  const lines=[];for(let i=0;i<items.length;i+=per)lines.push(items.slice(i,i+per));
  const lh=18;let y=cy-(lines.length-1)*lh/2+5;
  return lines.map(l=>{const s=`<text x="${cx}" y="${y}" text-anchor="middle" font-size="15.5" font-weight="600" fill="#3A0C16">${l.map(it=>esc(it.a)+(it.r?'<tspan font-size="9" fill="#A5171F">R</tspan>':'')).join(' ')}</text>`;y+=lh;return s;}).join('');
}
const SVGHEAD=(title)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 412 412" role="img" aria-label="${esc(title)}" font-family="Hind,'Noto Sans Devanagari',sans-serif">`;
function svgNorth(housePl,signs,title,ascLabel){
  let s=SVGHEAD(title)+`<rect width="400" height="400" fill="#F1E3B6" stroke="#3A0C16" stroke-width="3"/>`+
   `<path d="M0 0L400 400M400 0L0 400M200 0L400 200L200 400L0 200Z" fill="none" stroke="#3A0C16" stroke-width="2"/>`;
  for(let h=0;h<12;h++){
    if(signs&&signs[h]!=null) s+=`<text x="${NSIGN_P[h][0]}" y="${NSIGN_P[h][1]+4}" text-anchor="middle" font-size="13" fill="#A5171F">${dn(signs[h]+1)}</text>`;
    if(housePl[h]&&housePl[h].length) s+=textBlock(housePl[h],NPOLY_C[h][0],NPOLY_C[h][1],NPER[h]);
  }
  if(ascLabel) s+=`<text x="200" y="38" text-anchor="middle" font-size="14" font-weight="600" fill="#A5171F">${esc(ascLabel)}</text>`;
  return s+'</svg>';
}
const SPOS={11:[0,0],0:[1,0],1:[2,0],2:[3,0],10:[0,1],3:[3,1],9:[0,2],4:[3,2],8:[0,3],7:[1,3],6:[2,3],5:[3,3]};
function svgSouth(signPl,lagnaSign,title,ascLabel){
  let s=SVGHEAD(title)+`<rect width="400" height="400" fill="#F1E3B6" stroke="#3A0C16" stroke-width="3"/>`;
  for(let i=1;i<4;i++){
    s+=`<path d="M${i*100} 0V${i===2?0:400}" stroke="#3A0C16" stroke-width="2"/>`;
  }
  // draw cell borders explicitly
  s=SVGHEAD(title)+`<rect width="400" height="400" fill="#F1E3B6" stroke="#3A0C16" stroke-width="3"/>`;
  for(const k in SPOS){const [c,r]=SPOS[k];s+=`<rect x="${c*100}" y="${r*100}" width="100" height="100" fill="none" stroke="#3A0C16" stroke-width="2"/>`;}
  for(const k in SPOS){const [c,r]=SPOS[k];const x=c*100,y=r*100;const sg=+k;
    s+=`<text x="${x+7}" y="${y+16}" font-size="12" fill="#A5171F">${dn(sg+1)}</text>`;
    if(sg===lagnaSign){s+=`<path d="M${x} ${y}L${x+26} ${y}L${x} ${y+26}Z" fill="#A5171F" opacity=".35"/>`;}
    const items=signPl[sg]||[];
    if(items.length) s+=textBlock(items,x+50,y+54,2);
  }
  if(ascLabel) s+=`<text x="200" y="190" text-anchor="middle" font-size="16" fill="#A5171F">${esc(ascLabel)}</text>`;
  return s+'</svg>';
}
function chartSvg(style,items,lagnaSign,title,ascLabel){ // items: [{sign,a,r}]
  if(style==='south'){const sp=Array.from({length:12},()=>[]);items.forEach(i=>sp[i.sign].push(i));return svgSouth(sp,lagnaSign,title,ascLabel);}
  const hp=Array.from({length:12},()=>[]);items.forEach(i=>hp[(i.sign-lagnaSign+12)%12].push(i));
  const signs=Array.from({length:12},(_,h)=>(lagnaSign+h)%12);
  return svgNorth(hp,signs,title,ascLabel);
}

function dignityNote(g){
  const k=g.k;if(k==='Rahu'||k==='Ketu')return '';
  const n=[];if(EXALT[k]===g.sign)n.push(t('exalted'));if(DEBIL[k]===g.sign)n.push(t('debil'));if(OWN[k].includes(g.sign))n.push(t('own'));
  return n.join(', ');
}
function yogaList(ch){
  const out=[];const g=ch.g;const L=ch.lagnaSign;
  if(!ch.timeUnknown){
    if([1,2,4,7,8,12].includes(g.Mars.house)) out.push(t('manglik').replace('{h}',dn(g.Mars.house)));else out.push(t('notManglik'));
  }
  const dm=((g.Jupiter.sign-g.Moon.sign)+12)%12; if([0,3,6,9].includes(dm)) out.push(t('gajake'));
  if(g.Sun.sign===g.Mercury.sign) out.push(t('budhad'));
  if(!ch.timeUnknown){
    const pm={Mars:{en:'Ruchaka',dv:'रुचक'},Mercury:{en:'Bhadra',dv:'भद्र'},Jupiter:{en:'Hamsa',dv:'हंस'},Venus:{en:'Malavya',dv:'मालव्य'},Saturn:{en:'Shasha',dv:'शश'}};
    for(const k in pm){const gg=g[k];const kendra=[1,4,7,10].includes(gg.house);if(kendra&&(OWN[k].includes(gg.sign)||EXALT[k]===gg.sign))
      out.push(t('pm').replace('{p}',isDv()?pm[k].dv:pm[k].en).replace('{g}',gName(k)));}
  }
  const r=g.Rahu.lon;const inArc=(a,b,x)=>norm(x-a)<norm(b-a);
  const seven=['Sun','Moon','Mars','Mercury','Jupiter','Venus','Saturn'];
  if(seven.every(k=>inArc(r,r+180,g[k].lon))||seven.every(k=>inArc(r+180,r+360,g[k].lon))) out.push(t('kaalsarp'));
  return out.length?out:[t('noYoga')];
}
function currentDasha(ch){
  const now=Date.now();const md=ch.dasha.find(m=>now>=m.start&&now<m.end);
  return md?{md,ad:md.ad.find(a=>now>=a.start&&now<a.end)}:null;
}

function vargaSign(lon,n){
  const s=Math.floor(lon/30),d=lon-s*30,odd=s%2===0;
  switch(n){
    case 2: return odd?(d<15?4:3):(d<15?3:4);
    case 3: return (s+4*Math.floor(d/10))%12;
    case 7: return ((odd?s:s+6)+Math.floor(d/(30/7)))%12;
    case 9: return Math.floor(lon*9/30)%12;
    case 12: return (s+Math.floor(d/2.5))%12;
    case 30: return odd?(d<5?0:d<10?10:d<18?8:d<25?2:6):(d<5?1:d<12?5:d<20?11:d<25?9:7);
  }
  return s;
}
function vashyaOf(lon){const s=Math.floor(lon/30),d=lon%30;
  return ['C','C','M','J','V','M','M','K',d<15?'M':'C',d<15?'C':'J','M','J'][s];}
function ymd(ms){const Y=365.25*864e5;let y=Math.floor(ms/Y);let r=ms-y*Y;let m=Math.floor(r/(Y/12));r-=m*(Y/12);let d=Math.floor(r/864e5);
  return `${dn(y)}${t('yrs')} ${dn(m)}${t('mons')} ${dn(d)}${t('dys')}`;}
function yoginiDasha(moonLon,birthMs){
  const nl=360/27,ni=Math.floor(moonLon/nl),frac=(moonLon-ni*nl)/nl,Y=365.25*864e5;
  const s=(ni+1+3)%8,first=s===0?7:s-1;
  let t0=birthMs-frac*(first+1)*Y;const list=[];
  for(let i=0;i<24;i++){const k=(first+i)%8;const dur=(k+1)*Y;list.push({k,start:t0,end:t0+dur});t0+=dur;}
  return list;
}
function extras(ch){
  const {jd,pos,inp,panch,g}=ch;
  const sunS=Math.floor(pos.Sun.lon/30);
  const ayana=[9,10,11,0,1,2].includes(sunS)?'uttarayana':'dakshinayana';
  const ritu=Math.floor(((sunS+1)%12)/2);
  // previous new moon -> amanta month; Nepal names months purnimanta
  let e=norm(moonTrop(jd)-sunTrop(jd)),jn=jd-e/12.1907;
  for(let i=0;i<4;i++){let e2=norm(moonTrop(jn)-sunTrop(jn));if(e2>180)e2-=360;jn-=e2/12.1907;}
  let masa=(Math.floor(norm(sunTrop(jn)-ayanamsa(jn))/30)+1)%12;
  if(panch.tithiN>15)masa=(masa+1)%12;
  const samv=((ch.bs.y-110)%60+60)%60;
  let ish=null;
  if(!ch.timeUnknown){let tt=inp.h+inp.mi/60-panch.sunrise;if(tt<0)tt+=24;const gh=tt*60/24;ish={gh:Math.floor(gh),pl:Math.floor((gh-Math.floor(gh))*60)};}
  const a=allPositions(jd-0.5).pos,b=allPositions(jd+0.5).pos;
  const speed={};GRAHA.forEach(k=>speed[k]=wrap180(b[k].lon-a[k].lon));
  const ml=pos.Moon.lon;
  const avak={varna:Math.floor(ml/30)%4,vashya:vashyaOf(ml),yoni:YONI_IDX[g.Moon.nak],gana:GANA_STR[g.Moon.nak],nadi:[0,1,2,2,1,0][g.Moon.nak%6],tatva:Math.floor(ml/30)%4,
    rashiLord:SIGN_LORD[Math.floor(ml/30)],nakLord:DSEQ[g.Moon.nak%9]};
  const vargas={};
  [2,3,7,9,12,30].forEach(n=>{vargas[n]={lagna:ch.timeUnknown?vargaSign(ml,n):vargaSign(ch.asc.lon,n),items:ch.gr.map(x=>({sign:vargaSign(x.lon,n),a:gAb(x.k),r:false}))};});
  const chalit=ch.gr.map(x=>({house:Math.floor(norm(x.lon-ch.asc.lon+15)/30)+1,a:gAb(x.k),r:x.retro&&x.k!=='Rahu'&&x.k!=='Ketu'}));
  const bal=ch.dasha[0].end-ch.ms;
  return {ayana,ritu,masa,samv,ish,speed,avak,vargas,chalit,bal,yog:yoginiDasha(ml,ch.ms)};
}
function fmtSpashta(lon){const s=Math.floor(lon/30),d=lon-s*30,dd=Math.floor(d),mf=(d-dd)*60,mm=Math.floor(mf),ss=Math.floor((mf-mm)*60);

  return `स्वस्ति श्रीमन्नृपविक्रमादित्य संवत् ${dn(bs.y)}, शाके ${dn(bs.y-135)}, ${samv} नाम संवत्सर, ${ay}, ${ritu} ऋतु, ${masa} ${hi?'मास':'महिना'} ${paksha} पक्ष, ${bsmName(bs.m)} ${dn(bs.d)} ${hi?'गते':'गते'} ${wdName(panch.wd)}, ${t('tithi')} ${tithi}, ${t('nakshatra')} ${nak} (${t('pada')} ${dn(g.Moon.pada)}), ${yoga} ${t('yoga')}, ${kar} ${t('karana')}${ish?`, ${ish}`:''}${lag?`, ${lag} ${t('lagna')}`:''}, ${ras} ${hi?'राशि में':'राशिमा'} ${who}। शुभम्।`;
}

  let cChalit='';
  if(!ch.timeUnknown){
    if(style==='south'){const sp=Array.from({length:12},()=>[]);X.chalit.forEach(c=>sp[(ch.lagnaSign+c.house-1)%12].push(c));cChalit=svgSouth(sp,ch.lagnaSign,t('chalitChart'),'');}
    else{const hp=Array.from({length:12},()=>[]);X.chalit.forEach(c=>hp[c.house-1].push(c));cChalit=svgNorth(hp,Array.from({length:12},(_,h)=>(ch.lagnaSign+h)%12),t('chalitChart'),ascL);}
  }
  const small=[[2,'hora'],[3,'drek'],[7,'sapt'],[12,'dwad'],[30,'trim']].map(([n,k])=>fig(chartSvg(style,X.vargas[n].items,X.vargas[n].lagna,t(k),''),t(k))).join('');
  const bs=ch.bs;
  const paksha=panch.tithiN<=15?t('shukla'):t('krishna');
  const moonNak=g.Moon.nak;const naam=NAAM[moonNak][g.Moon.pada-1];
  const tzs=(ch.tzH>=0?'+':'−')+dn(pad(Math.floor(Math.abs(ch.tzH))))+':'+dn(pad(Math.round((Math.abs(ch.tzH)%1)*60)));
  const kv=(a,b)=>`<div><span>${esc(a)}</span><span>${b}</span></div>`;
  const nm=document.getElementById('nm').value.trim();
  const sr=panch.sunrise;
  const details=[
    kv(t('adDate'),dn(`${inp.y}-${pad(inp.m)}-${pad(inp.d)}`)),
    kv(t('bsDate'),`${dn(bs.y)} ${esc(bsmName(bs.m))} ${dn(bs.d)}`),
    kv(t('vs'),dn(bs.y)),kv(t('shaka'),dn(bs.y-135)),
    kv(t('samvatsar'),esc(L3(SAMV_DV,SAMV_EN,X.samv))),kv(t('ayana'),esc(t(X.ayana))),
    kv(t('ritu'),esc(L3(RITU_DV,RITU_EN,X.ritu))),kv(t('masa'),`${esc(L3(MASA_DV,MASA_EN,X.masa))} ${esc(paksha)}`),
    kv(t('timeLbl'),ch.timeUnknown?'—':dn(`${pad(inp.h)}:${pad(inp.mi)}`)),
    kv(t('ishtakal'),X.ish?`${dn(X.ish.gh)} ${esc(t('ghadi'))} ${dn(X.ish.pl)} ${esc(t('pala'))}`:'—'),
    kv(t('sunriseLbl'),dn(`${pad(Math.floor(sr))}:${pad(Math.floor((sr%1)*60))}`)),
    kv(t('placeLbl'),esc(inp.placeName||'—')),
    kv(t('coords'),`${dn(inp.lat.toFixed(3))}°, ${dn(inp.lon.toFixed(3))}°`),
    kv(t('offsetLbl'),`UTC${tzs}`)
  ].join('');
  const panchRows=[
    kv(t('vara'),esc(wdName(panch.wd))+' · '+esc(gName(WDLORD[panch.wd]))),
    kv(t('tithi'),`${esc(paksha)} ${esc(tithiName(panch.tithiN))}`),
    kv(t('nakshatra'),`${esc(nakName(moonNak))} · ${t('pada')} ${dn(g.Moon.pada)}`),
    kv(t('yoga'),esc(isDv()?YOGA_DV[panch.yogaN]:YOGA_EN[panch.yogaN])),
    kv(t('karana'),esc(isDv()?KAR_DV[panch.karana]:KAR_EN[panch.karana])),
    kv(t('moonSign'),esc(signName(g.Moon.sign))),
    ch.timeUnknown?'':kv(t('lagna'),`${esc(signName(asc.sign))} · ${fmtDeg(asc.deg)}`),
    kv(t('namaksh'),esc(naam)),
    kv(t('ayan'),dn(fmtDeg(ch.ay)))
  ].join('');
  const A=X.avak;
  const avakRows=[
    kv(t('varna'),esc(L3(VARNA_DV,VARNA_EN,A.varna))),kv(t('vashya'),esc((isDv()?VASHYA_DV:VASHYA_EN)[A.vashya])),
    kv(t('yoni'),esc(L3(YONI_DV,YONI_EN,A.yoni))),kv(t('gana'),esc((isDv()?GANA_DV:GANA_EN)[A.gana])),
    kv(t('nadi'),esc(L3(NADI_DV,NADI_EN,A.nadi))),kv(t('tatva'),esc(L3(TATVA_DV,TATVA_EN,A.tatva))),
    kv(t('rashiLord'),esc(gName(A.rashiLord))),kv(t('nakLord'),esc(gName(A.nakLord)))
  ].join('');
  const rows=ch.gr.map(x=>{
    const notes=[x.retro&&x.k!=='Rahu'&&x.k!=='Ketu'?t('retro'):'',dignityNote(x)].filter(Boolean).join(', ');
    return `<tr><td>${esc(gName(x.k))}</td><td>${esc(signShort(x.sign))}</td><td class="num">${fmtSpashta(x.lon)}</td><td class="num">${fmtSpeed(X.speed[x.k])}</td><td>${esc(nakName(x.nak))} · ${dn(x.pada)}</td><td>${ch.timeUnknown?'—':dn(x.house)}</td><td>${esc(notes)}</td></tr>`;}).join('')+
    (ch.timeUnknown?'':`<tr><td>${esc(t('lagna'))}</td><td>${esc(signShort(asc.sign))}</td><td class="num">${fmtSpashta(asc.lon)}</td><td></td><td>${esc(nakName(asc.nak))} · ${dn(asc.pada)}</td><td>${dn(1)}</td><td></td></tr>`);
  const cd=currentDasha(ch);
  const dRows=ch.dasha.slice(0,10).map(m=>{const cur=cd&&cd.md===m;const st=Math.max(m.start,ch.ms);
    return `<tr class="${cur?'cur':''}"><td>${esc(gName(m.lord))}${cur?' · '+esc(t('current')):''}</td><td class="num">${dn(isoDate(st))}</td><td class="num">${dn(isoDate(m.end))}</td></tr>`;}).join('');
  const aRows=cd?cd.md.ad.filter(a=>a.end>ch.ms).map(a=>{const cur=cd.ad===a;return `<tr class="${cur?'cur':''}"><td>${esc(gName(cd.md.lord))}–${esc(gName(a.lord))}</td><td class="num">${dn(isoDate(Math.max(a.start,ch.ms)))}</td><td class="num">${dn(isoDate(a.end))}</td></tr>`;}).join(''):'';
  const now=Date.now();let yi=X.yog.filter(y=>y.end>ch.ms).findIndex(y=>now>=y.start&&now<y.end);if(yi<0)yi=0;
  const yStart=Math.max(0,yi-2);
  const yRows=X.yog.filter(y=>y.end>ch.ms).slice(yStart,yStart+9).map(y=>{const cur=now>=y.start&&now<y.end;
    return `<tr class="${cur?'cur':''}"><td>${esc(L3(YOG_DV,YOG_EN,y.k))} (${esc(gName(YOG_LORD[y.k]))})</td><td class="num">${dn(isoDate(Math.max(y.start,ch.ms)))}</td><td class="num">${dn(isoDate(y.end))}</td></tr>`;}).join('');
  const PL=lang==='en'?'en':'ne';
  const phal=[];
  if(typeof GK!=='undefined'){
    if(!ch.timeUnknown)phal.push(`${t('lagna')} ${signShort(asc.sign)}: ${GK.signTraits[PL][asc.sign]}`);
    phal.push(`${t('moonSign').split(' (')[0]} ${signShort(g.Moon.sign)}: ${GK.signTraits[PL][g.Moon.sign]}`);
    phal.push(`${nakName(moonNak)}: ${GK.nak[PL][moonNak]}`);
    if(cd)phal.push(`${gName(cd.md.lord)} ${t('mahadasha')}: ${GK.dasha[PL][cd.md.lord]}`);
  }
  const yogas=phal.concat(yogaList(ch)).map(y=>`<li>${esc(y)}</li>`).join('');
  const warns=[];
  if(inp.y<1800||inp.y>2050)warns.push(t('rangeWarn'));
  if(ch.timeUnknown)warns.push(t('unknownWarn'));
  return `<div class="scrollwrap"><article class="scroll" id="scroll" lang="${lang}">
    <div class="inv"><div class="om">ॐ</div><div class="gan">${esc(t('invocation'))}</div></div>
    <p class="shloka">जननी जन्मसौख्यानां वर्धनी कुलसम्पदाम्। पदवी पूर्वपुण्यानां लिख्यते जन्मपत्रिका॥</p>
    <div class="ttl">${esc(t('scrollTitle'))}</div>
    ${nm?`<div class="who">${esc(nm)}</div>`:''}
    <p class="para">${esc(birthPara(ch,X))}</p>
    ${warns.map(w=>`<p class="small">⚠ ${esc(w)}</p>`).join('')}
    <div class="cols"><div class="colA">
    <h3>${esc(t('secDetails'))}</h3><div class="kv">${details}</div>
    <h3>${esc(t('secPanchang'))}</h3><div class="kv">${panchRows}</div>
    <h3>${esc(t('secAvak'))}</h3><div class="kv">${avakRows}</div>
    <h3>${esc(t('secGraha'))}</h3>
    <div class="tw"><table><thead><tr><th>${esc(t('graha'))}</th><th>${esc(t('rashi'))}</th><th>${esc(t('spashta'))}</th><th>${esc(t('gati'))}</th><th>${esc(t('nakPada'))}</th><th>${esc(t('bhava'))}</th><th>${esc(t('note'))}</th></tr></thead><tbody>${rows}</tbody></table></div>
    <h3>${esc(t('secPhal'))}</h3><ul>${yogas}</ul>
    <h3>${esc(t('secDasha'))}</h3>
    <p style="margin:2px 0 6px">${esc(t('dashaBal'))}: <b>${esc(gName(ch.dasha[0].lord))} ${ymd(X.bal)}</b></p>
    <div class="tw"><table><thead><tr><th>${esc(t('mahadasha'))}</th><th>${esc(t('from'))}</th><th>${esc(t('to'))}</th></tr></thead><tbody>${dRows}</tbody></table></div>
    </div><div class="colB">
    <h3>${esc(t('secCharts'))}</h3>
    <div class="cgrid">${fig(cLagna,lagTitle,'fig1')}${fig(cMoon,t('chandraChart'))}${fig(cNav,t('navChart'))}${cChalit?fig(cChalit,t('chalitChart')):''}</div>
    <h3>${esc(t('saptavarga'))}</h3>
    <div class="cgrid c3">${small}</div>
    ${cd?`<h3>${esc(t('antardasha'))}</h3><div class="tw"><table><tbody>${aRows}</tbody></table></div>`:''}
    <h3>${esc(t('yoginiT'))}</h3>
    <div class="tw"><table><thead><tr><th>${esc(t('yogini'))}</th><th>${esc(t('from'))}</th><th>${esc(t('to'))}</th></tr></thead><tbody>${yRows}</tbody></table></div>
    </div></div>
    <p class="small">${esc(t('paraNote'))}</p>
  </article></div>`;
}

/* ===== Download helpers ===== */
async function saveFile(name,data,statusEl){
  try{
    const type=name.endsWith('.svg')?'image/svg+xml':'text/html';
    const url=URL.createObjectURL(new Blob([data],{type:type+';charset=utf-8'}));
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);statusEl.textContent=t('saved');
  }catch(e){statusEl.textContent=t('errGeneric');}
}
function standaloneHtml(){
  const sc=document.getElementById('scroll');
  const css=document.getElementById('scrollcss').textContent;
  return `<!DOCTYPE html><html lang="${lang}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chhina</title>`+
   `<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Yatra+One&display=swap" rel="stylesheet"><style>body{margin:0;padding:24px 14px;background:#2b1d14}${css}</style></head><body>${sc.outerHTML}</body></html>`;
}

/* ===== PDF (one Letter page) ===== */
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function savePdf(statusEl,btn){
  const src=document.getElementById('scroll');if(!src)return;
  btn.disabled=true;statusEl.textContent=t('pdfMaking');
  let sheet;
  try{
    await Promise.all([loadScript('vendor/html2canvas.min.js'),loadScript('vendor/jspdf.umd.min.js')]);
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    sheet=document.createElement('div');sheet.className='sheet';
    const fit=document.createElement('div');fit.className='fit';
    const clone=src.cloneNode(true);clone.removeAttribute('id');clone.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
    const foot=document.createElement('div');foot.className='pfoot';
    foot.textContent=t('pdfMade')+' · '+dn(new Date().toISOString().slice(0,10));
    fit.appendChild(clone);fit.appendChild(foot);sheet.appendChild(fit);document.body.appendChild(sheet);
    // Shrink to fit one page: widen the layout and scale it down until it fits the height.
    // Fit one page: scale down to the page height, widen the text to use the full width, repeat until stable.
    const W=756,H=996;let scale=1;
    for(let i=0;i<6;i++){fit.style.width=(W/scale)+'px';const h=fit.scrollHeight;const ns=Math.min(1,H/h);if(Math.abs(ns-scale)<0.004){scale=Math.min(scale,ns);break;}scale=ns;}
    fit.style.width=(W/scale)+'px';if(fit.scrollHeight*scale>H)scale=H/fit.scrollHeight;
    fit.style.transform=`scale(${scale})`;
    const canvas=await html2canvas(sheet,{scale:2.5,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:1200});
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({unit:'in',format:'letter',orientation:'portrait'});
    pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,0,8.5,11);
    const nm=(document.getElementById('nm').value.trim()||'chhina').replace(/[\\/:*?"<>|]+/g,'').slice(0,40);
    pdf.save(`${nm}-chhina.pdf`);
    statusEl.textContent=t('pdfDone');
  }catch(e){statusEl.textContent=t('pdfFail');try{window.print();}catch(_){}}
  finally{if(sheet)sheet.remove();btn.disabled=false;}
}

/* ===== Create tab ===== */
let lastChart=null;
function renderCreate(ch){
  const box=document.getElementById('createOut');
  box.innerHTML=renderScroll(ch)+
   `<div class="btnrow" style="justify-content:center">
      <button class="btn" id="bPdf" type="button">${esc(t('savePdf'))}</button>
      <button class="btn ghost" id="bSave" type="button">${esc(t('saveHtml'))}</button>
      <button class="btn ghost" id="bSvg" type="button">${esc(t('saveSvg'))}</button>
    </div><p class="hint" id="saveMsg" style="text-align:center"></p>
    ${guidePanels('c')}`;
  const msg=document.getElementById('saveMsg');
  document.getElementById('bPdf').onclick=e=>savePdf(msg,e.currentTarget);
  document.getElementById('bSave').onclick=()=>saveFile('chhina.html',standaloneHtml(),msg);
  document.getElementById('bSvg').onclick=()=>{const svg=document.querySelector('#fig1 svg').outerHTML;saveFile('chhina-lagna.svg','<?xml version="1.0" encoding="UTF-8"?>\n'+svg,msg);};
  wireGuide('c',chartFromCalc(ch));
}
function readForm(){
  const err=m=>{throw new Error(m)};
  const mode=document.getElementById('calMode').value;
  let y,m,d;
  if(mode==='AD'){const v=document.getElementById('adDate').value;if(!v)err(t('errNoDate'));[y,m,d]=v.split('-').map(Number);if(!y||y<1000)err(t('errNoDate'));}
  else{const by=+document.getElementById('bsY').value,bm=+document.getElementById('bsM').value,bd=+document.getElementById('bsD').value;
    if(!by||!bd||bd<1||bd>32)err(t('errBS'));const a=bsToAD(by,bm,bd);y=a.y;m=a.m;d=a.d;}
  const unk=document.getElementById('tmUnknown').checked;
  let h=12,mi=0;
  if(!unk){const tv=document.getElementById('tm').value;if(!tv)err(t('errNoTime'));[h,mi]=tv.split(':').map(Number);}
  const lat=parseFloat(document.getElementById('lat').value),lon=parseFloat(document.getElementById('lon').value);
  if(isNaN(lat)||isNaN(lon)||Math.abs(lat)>89||Math.abs(lon)>180)err(t('errNoPlace'));
  const tz=document.getElementById('tzName').value.trim()||'Asia/Kathmandu';
  try{new Intl.DateTimeFormat('en-US',{timeZone:tz});}catch(e){err('Time zone name not recognised, e.g. Asia/Kathmandu or America/New_York.');}
  const ov=document.getElementById('offOv').value;
  const sel=document.getElementById('place');
  return {y,m,d,h,mi,lat,lon,tz,offOv:ov===''?null:parseFloat(ov),timeUnknown:unk,placeName:sel.value==='custom'?`${lat.toFixed(2)}°, ${lon.toFixed(2)}°`:sel.options[sel.selectedIndex].text};
}
function generate(){
  const e=document.getElementById('formErr');e.textContent='';
  try{const inp=readForm();lastChart=computeChart(inp);guideState.c={turns:[]};renderCreate(lastChart);
    document.getElementById('createOut').scrollIntoView({behavior:'smooth',block:'start'});}
  catch(x){e.textContent=x.message;}
}

/* ===== Read tab (manual entry) ===== */
let lastManual=null;
function setFile(f){
  if(!f)return;
  const rd=new FileReader();rd.onload=()=>{const p=document.getElementById('prev');p.src=rd.result;p.classList.remove('hidden');};rd.readAsDataURL(f);
}
function buildManualOptions(){
  const signOpts=`<option value="">${esc(t('mUnknown'))}</option>`+Array.from({length:12},(_,i)=>`<option value="${i}">${dn(i+1)} · ${esc(signShort(i))}</option>`).join('');
  const set=(id,html)=>{const el=document.getElementById(id);const v=el.value;el.innerHTML=html;el.value=v;};
  set('mLagna',signOpts);
  const prev={};GRAHA.forEach(k=>{const el=document.getElementById('mP_'+k);prev[k]=el?el.value:'';});
  document.getElementById('mPlanets').innerHTML=GRAHA.map(k=>`<div><label for="mP_${k}">${esc(gName(k))}</label><select id="mP_${k}">${signOpts}</select></div>`).join('');
  GRAHA.forEach(k=>document.getElementById('mP_'+k).value=prev[k]||'');
  set('mNak',`<option value="">${esc(t('mUnknown'))}</option>`+Array.from({length:27},(_,i)=>`<option value="${i}">${dn(i+1)} · ${esc(nakName(i))}</option>`).join(''));
  set('mPada',`<option value="">${esc(t('mUnknown'))}</option>`+[1,2,3,4].map(p=>`<option value="${p}">${dn(p)}</option>`).join(''));
  set('mDasha',`<option value="">${esc(t('mUnknown'))}</option>`+DSEQ.map(k=>`<option value="${k}">${esc(gName(k))}</option>`).join(''));
}
function readManual(){
  const v=id=>document.getElementById(id).value;
  const num=id=>v(id)===''?null:+v(id);
  const P={};GRAHA.forEach(k=>{const s=num('mP_'+k);if(s!=null)P[k]={sign:s,house:0,retro:false};});
  let lagna=num('mLagna');const moonChart=lagna==null;
  if(moonChart){if(!P.Moon)throw new Error(t('mErrNeed'));lagna=P.Moon.sign;}
  GRAHA.forEach(k=>{if(P[k])P[k].house=((P[k].sign-lagna+12)%12)+1;});
  const md=v('mDasha');
  return {name:v('mName').trim(),lagna,moonChart,P,nak:num('mNak'),pada:num('mPada'),
    dasha:md?{md,ad:null,mdEnd:null,adEnd:null}:null,saturnNow:saturnNowSign(),Ldeg:null};
}
function renderManual(){
  const C=lastManual;if(!C)return;
  const items=GRAHA.filter(k=>C.P[k]).map(k=>({sign:C.P[k].sign,a:gAb(k),r:false}));
  const style=document.getElementById('style').value;
  const svg=chartSvg(style,items,C.lagna,t('mChart'),C.moonChart?'':(isDv()?'ल':'Asc'));
  document.getElementById('readOut').innerHTML=`<div class="card"><h2>${esc(t('mChart'))}${C.name?' — '+esc(C.name):''}</h2>
    <div class="scroll" style="margin:14px auto;max-width:440px;padding:22px"><div class="charts"><figure style="max-width:400px">${svg}<figcaption>${esc(C.moonChart?t('chandraChart'):t('lagnaChart'))}</figcaption></figure></div></div></div>
    ${guidePanels('r')}`;
  wireGuide('r',C);
}
function doManual(){
  const er=document.getElementById('mErr');er.textContent='';
  try{lastManual=readManual();guideState.r={turns:[]};renderManual();
    if(window.innerWidth<960)document.getElementById('readOut').scrollIntoView({behavior:'smooth',block:'start'});}
  catch(e){er.textContent=e.message;}
}

/* ===== Wiring ===== */
function syncCal(){const m=document.getElementById('calMode').value;document.getElementById('adBox').classList.toggle('hidden',m!=='AD');document.getElementById('bsBox').classList.toggle('hidden',m!=='BS');}
function showTab(n){
  document.getElementById('paneCreate').classList.toggle('hidden',n!=='create');
  document.getElementById('paneRead').classList.toggle('hidden',n!=='read');
  document.getElementById('tabC').setAttribute('aria-selected',n==='create');
  document.getElementById('tabR').setAttribute('aria-selected',n==='read');
}
(function init(){
  const sel=document.getElementById('place');
  let html='';PLACES.forEach(([grp,list,tz])=>{html+=`<optgroup label="${esc(grp)}">`+list.map(p=>`<option value="${esc(p[0])}" data-lat="${p[1]}" data-lon="${p[2]}" data-tz="${p[3]||tz}">${esc(p[0])}</option>`).join('')+'</optgroup>';});
  html+=`<option value="custom">${esc(T.en.custom||'Other place (enter coordinates)')}</option>`;
  sel.innerHTML=html;
  T.en.custom='Other place (enter coordinates)';T.ne.custom='अन्य ठाउँ (अक्षांश/देशान्तर हाल्नुहोस्)';T.hi.custom='अन्य स्थान (निर्देशांक डालें)';
  function onPlace(){const o=sel.options[sel.selectedIndex];if(o.value==='custom')return;
    document.getElementById('lat').value=o.dataset.lat;document.getElementById('lon').value=o.dataset.lon;document.getElementById('tzName').value=o.dataset.tz;}
  sel.addEventListener('change',onPlace);
  sel.value='Kathmandu';onPlace();
  ['lat','lon','tzName'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{sel.value='custom';}));
  document.getElementById('calMode').addEventListener('change',syncCal);
  document.getElementById('tmUnknown').addEventListener('change',e=>{document.getElementById('tm').disabled=e.target.checked;});
  document.getElementById('go').addEventListener('click',generate);
  document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;applyLang();
    const c=document.querySelector('#place option[value="custom"]');if(c)c.textContent=t('custom');}));
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
  const file=document.getElementById('file'),drop=document.getElementById('drop');
  const pick=()=>file.click();
  drop.addEventListener('click',pick);drop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();}});
  file.addEventListener('change',()=>setFile(file.files[0]));
  ['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('on');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('on');}));
  drop.addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files[0])setFile(e.dataTransfer.files[0]);});
  document.getElementById('mGo').addEventListener('click',doManual);
  applyLang();
  const c=document.querySelector('#place option[value="custom"]');if(c)c.textContent=t('custom');
})();
</script>
